name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with the Windows-internal C# compiler
        shell: cmd
        run: build.cmd

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: WinHealthAudit
          path: bin/*.exe
          if-no-files-found: error
