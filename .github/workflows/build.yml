name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with the Windows-internal C# compiler
        shell: cmd
        run: build.cmd

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: WinHealthAudit
          path: bin/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          name: WinHealthAudit
          path: bin

      - name: Create GitHub release with the executables
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag  = $env:GITHUB_REF_NAME
          $title = "WinHealthAudit $($tag -replace '^v','')"
          $assets = 'bin/WinHealthAudit.exe', 'bin/WinHealthAudit.Core.exe'
          $notes = "docs/release-notes/$tag.md"

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
          } elseif (Test-Path $notes) {
            gh release create $tag $assets --title $title --notes-file $notes
          } else {
            gh release create $tag $assets --title $title --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
